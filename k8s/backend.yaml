apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: delibms/multitier-backend:1.0
          ports:
            - containerPort: 3000
          env:
            - name: DB_HOST
              value: db                 # for Amazon RDS, put the RDS endpoint here
            - name: DB_NAME
              valueFrom: { secretKeyRef: { name: db-secret, key: MYSQL_DATABASE } }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: db-secret, key: MYSQL_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: db-secret, key: MYSQL_PASSWORD } }
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - port: 3000
